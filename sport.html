      text-align: center;
      padding: 3rem;
      color: var(--text-muted);
    }

    .leaflet-tile-pane { filter: none; }

  <script src="script.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
  <script>
    (async function () {
      const res = await fetch('sport/tours.json');
      const data = await res.json();
      const tours = data.tours || [];

      if (!tours.length) {
        document.getElementById('heatmap').innerHTML =
          '<div class="sport-empty"><p>No tours yet. Run <code>KOMOOT_USER_ID=&lt;id&gt; node fetch-komoot.js</code> to fetch your Komoot data.</p></div>';
        return;
      }

      // Stats
      const totalTours = tours.length;
      const totalKm = tours.reduce((s, t) => s + (t.distance || 0), 0) / 1000;
      const totalElevation = tours.reduce((s, t) => s + (t.elevation_up || 0), 0);
      const runCount = tours.filter(t => t.sport === 'jogging').length;
      const bikeCount = totalTours - runCount;

      const statsEl = document.getElementById('sport-stats');
      statsEl.innerHTML = `
        <div class="sport-stat"><div class="sport-stat-value">${totalTours}</div><div class="sport-stat-label">Tours</div></div>
        <div class="sport-stat"><div class="sport-stat-value">${totalKm.toFixed(0)}</div><div class="sport-stat-label">Kilometers</div></div>
        <div class="sport-stat"><div class="sport-stat-value">${totalElevation.toFixed(0)}</div><div class="sport-stat-label">Elevation (m)</div></div>
        <div class="sport-stat"><div class="sport-stat-value">${runCount}</div><div class="sport-stat-label">Runs</div></div>
        <div class="sport-stat"><div class="sport-stat-value">${bikeCount}</div><div class="sport-stat-label">Rides</div></div>
      `;

      // Collect all coordinates
      const allPoints = [];
      for (const tour of tours) {
        if (tour.coordinates) {
          for (const [lat, lng] of tour.coordinates) {
            allPoints.push([lat, lng, 0.5]); // intensity
          }
        }
      }

      if (!allPoints.length) {
        document.getElementById('heatmap').innerHTML =
          '<div class="sport-empty"><p>Tours found but no coordinate data available.</p></div>';
        return;
      }

      // Compute center
      const avgLat = allPoints.reduce((s, p) => s + p[0], 0) / allPoints.length;
      const avgLng = allPoints.reduce((s, p) => s + p[1], 0) / allPoints.length;

      // Determine if dark mode
      const isDark = !document.documentElement.hasAttribute('data-theme') ||
                     document.documentElement.getAttribute('data-theme') !== 'light';

      const tileUrl = isDark
        ? 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png'
        : 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png';

      const map = L.map('heatmap').setView([avgLat, avgLng], 11);
      L.tileLayer(tileUrl, {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/">CARTO</a>',
        maxZoom: 18,
      }).addTo(map);

      // Downsample if too many points (keep every Nth)
      let heatPoints = allPoints;
      if (allPoints.length > 50000) {
        const nth = Math.ceil(allPoints.length / 50000);
        heatPoints = allPoints.filter((_, i) => i % nth === 0);
      }

      L.heatLayer(heatPoints, {
        radius: 8,
        blur: 12,
        maxZoom: 15,
        gradient: { 0.2: '#2b83ba', 0.4: '#abdda4', 0.6: '#ffffbf', 0.8: '#fdae61', 1.0: '#d7191c' },
      }).addTo(map);

      // Fit bounds
      const lats = allPoints.map(p => p[0]);
      const lngs = allPoints.map(p => p[1]);
      map.fitBounds([
        [Math.min(...lats), Math.min(...lngs)],
        [Math.max(...lats), Math.max(...lngs)],
      ], { padding: [30, 30] });

      // Switch tiles on theme change
      const toggle = document.getElementById('theme-toggle');
      if (toggle) {
        toggle.addEventListener('click', () => {
          setTimeout(() => {
            const light = document.documentElement.getAttribute('data-theme') === 'light';
            map.eachLayer(l => { if (l instanceof L.TileLayer) map.removeLayer(l); });
            L.tileLayer(light
              ? 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png'
              : 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
              { attribution: '&copy; OSM &copy; CARTO', maxZoom: 18 }
            ).addTo(map);
          }, 100);
        });
      }
    })();
  </script>
</body>
